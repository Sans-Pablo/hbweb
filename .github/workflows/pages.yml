name: Publicar prueba web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/sim.test.mjs
      - run: node tests/magic-prep.test.mjs
      - run: node tests/magic-types.test.mjs
      - run: node tests/tutorial.test.mjs
      - run: node --test tests/assets.test.mjs tests/dungeon.test.mjs tests/net-dungeon.test.mjs
      - run: node tests/net-walk.test.mjs
      - run: python tests/version_web_test.py
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python tools/version_web.py web "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deployment
        uses: actions/deploy-pages@v4

