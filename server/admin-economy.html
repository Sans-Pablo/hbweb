<style>
#econv{display:none}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}.kpi{background:#2c2418;border:1px solid var(--line);border-radius:8px;padding:8px}.kpi b{display:block;font-size:20px;color:var(--gold)}.kpi small{opacity:.7}
.ecs{margin:0 0 12px}.ecs button.on{border-color:var(--gold);color:var(--gold)}.ecp{display:none}.ecp.on{display:block}.st-open{color:#ff8a70}.st-resolved,.st-dismissed{opacity:.6}
.ecb{display:inline-block;padding:1px 8px;border-radius:9px;font-size:12px}.ecb.ok{background:#2d4a2a}.ecb.warn{background:#5a4a1a}.ecb.bad{background:#5a2a20}
</style>
<div id="econv">
 <div class="card"><div class="row"><b style="color:var(--gold)">Monitor económico</b>
  <select id="ef-p"><option value="1">60 min</option><option value="24" selected>Hoy (24 h)</option><option value="168">7 días</option><option value="720">30 días</option><option value="c">Personalizado</option></select>
  <span id="ef-c" style="display:none"><input id="ef-from" type="datetime-local"> <input id="ef-to" type="datetime-local"></span>
  <label><input type="checkbox" id="ef-bots"> incluir bots/depuración</label><span class="dim" id="ef-meta"></span></div></div>
 <div class="ecs row"><button data-p="ov" class="on">Resumen</button><button data-p="live">En vivo</button><button data-p="flow">Flujo</button><button data-p="al">Alertas</button><button data-p="we">Riqueza</button><button data-p="mk">Mercado/Ítems</button><button data-p="sim">Balance/Simulación</button><button data-p="au">Auditoría</button><button data-p="so">Fuentes</button></div>
 <div class="ecp on card" id="p-ov"></div>
 <div class="ecp card" id="p-live"><div class="row"><span id="lv-st" class="ecb warn">desconectado</span><button id="lv-pause">Pausar</button><input id="lv-q" placeholder="Buscar jugador o motivo"><span class="dim" id="lv-n"></span></div><div class="log" id="lv-log"></div></div>
 <div class="ecp card" id="p-flow"><div class="row"><span class="dim">Haz clic en un punto de la gráfica para filtrar los eventos de ese tramo.</span></div><div id="fl-svg"></div><div class="grid2"><div id="fl-f"></div><div id="fl-s"></div></div><div id="fl-ev" style="margin-top:10px"></div></div>
 <div class="ecp card" id="p-al"><div class="row"><button id="al-ev">Evaluar reglas ahora</button><select id="al-st"><option value="">Todas</option><option>open</option><option>acknowledged</option><option>investigating</option><option>resolved</option><option>dismissed</option></select></div><div id="al-l"></div><details style="margin-top:10px"><summary>Umbrales (versionados)</summary><div id="al-cfg"></div></details></div>
 <div class="ecp card" id="p-we"></div>
 <div class="ecp card" id="p-mk"></div>
 <div class="ecp card" id="p-sim"><div class="row"><input id="sim-r" placeholder="Motivo (ej. bot_sell)"><input id="sim-f" type="number" step="0.1" min="0" max="10" value="1.5" style="width:90px"><button id="sim-go">Simular ×factor</button></div><div id="sim-o"></div></div>
 <div class="ecp card" id="p-au"></div>
 <div class="ecp card" id="p-so"></div>
</div>
<script>
(()=>{
const A="/api/admin/economy/",P=sel=>document.querySelector(sel),fmt=n=>n==null?"—":Math.round(n).toLocaleString("es-ES");
const st=JSON.parse((()=>{try{return localStorage.getItem("ecoF")||"{}"}catch{return"{}"}})());
const save=()=>{try{localStorage.setItem("ecoF",JSON.stringify(st))}catch{}};
let page="ov";
function qs(extra){const p=new URLSearchParams(extra||{});if(st.p==="c"&&st.from){p.set("from",st.from);if(st.to)p.set("to",st.to)}else if(!p.has("from"))p.set("hours",st.p||24);if(st.bots)p.set("artificial","all");return p.toString()}
const get=(u,e)=>fetch(A+u+"?"+qs(e)).then(r=>r.json());
const post=(u,b)=>fetch(A+u,{method:"POST",body:JSON.stringify(b)}).then(r=>r.json());
const meta=m=>m?"Actualizado "+m.updated_at.slice(11,19)+(m.freshnessMs!=null?" · último evento hace "+Math.round(m.freshnessMs/1000)+" s":""):"";
function line(ser,keys){const W=760,H=200,pad=34,t0=ser[0].t,t1=ser[ser.length-1].t||t0+1,mx=Math.max(1,...ser.flatMap(p=>keys.map(k=>p[k.k]))),x=t=>pad+(W-pad-8)*((t-t0)/Math.max(1,t1-t0)),y=v=>H-20-(H-30)*v/mx;
let s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-height:260px"><line x1="'+pad+'" y1="'+(H-20)+'" x2="'+W+'" y2="'+(H-20)+'" stroke="#4a3d2a"/><text x="2" y="14" fill="#999" font-size="10">'+fmt(mx)+"</text>";
for(const k of keys)s+='<polyline fill="none" stroke="'+k.c+'" stroke-width="2" points="'+ser.map(p=>x(p.t)+","+y(p[k.k])).join(" ")+'"/>';
s+=ser.map((p,i)=>'<circle data-i="'+i+'" cx="'+x(p.t)+'" cy="'+y(p[keys[0].k])+'" r="5" fill="#f0d27a" fill-opacity=".25" style="cursor:pointer"><title>'+new Date(p.t).toLocaleString()+" · "+keys.map(k=>k.k+" "+fmt(p[k.k])).join(" · ")+"</title></circle>").join("");
return s+'<text x="'+pad+'" y="'+(H-4)+'" fill="#999" font-size="10">'+new Date(t0).toLocaleString()+'</text><text x="'+(W-110)+'" y="'+(H-4)+'" fill="#999" font-size="10">'+new Date(t1).toLocaleString()+"</text></svg>"}
const bars=(rows,key)=>{const mx=Math.max(1,...rows.map(r=>r[key]));return rows.slice(0,12).map(r=>'<div class="bar"><span style="width:140px;overflow:hidden">'+esc(r.reason)+'</span><i style="width:'+Math.round(220*r[key]/mx)+'px"></i>'+fmt(r[key])+' <span class="dim">('+r.n+")</span></div>").join("")||'<span class="dim">Sin datos en el periodo</span>'};
const evTable=ev=>'<table class="bt"><thead><tr><th>Hora</th><th>Jugador</th><th>Motivo</th><th>Tipo</th><th>Oro</th><th>Saldo</th></tr></thead><tbody>'+ev.map(e=>"<tr><td>"+e.occurredAt.slice(5,19).replace("T"," ")+"</td><td>"+esc(e.actor)+(e.artificial?' <span class="pill">'+e.artificial+"</span>":"")+"</td><td>"+esc(e.source)+"</td><td>"+e.operation+'</td><td style="color:'+(e.delta<0?"#ff8a70":"#b9d6a5")+'">'+(e.delta>0?"+":"")+fmt(e.delta)+"</td><td>"+fmt(e.balanceAfter)+"</td></tr>").join("")+"</tbody></table>";
const sev=s=>'<span class="ecb '+(s==="critical"?"bad":s==="warning"?"warn":"ok")+'">'+s+"</span>";
const loaders={
async ov(){const o=await get("overview"),d=(a,b)=>b?Math.round((a-b)/Math.abs(b)*100)+" % vs periodo anterior":"sin periodo previo";
P("#p-ov").innerHTML='<div class="kpis"><div class="kpi"><small>Oro creado</small><b>'+fmt(o.created)+"</b><small>"+d(o.created,o.previous.created)+'</small></div><div class="kpi"><small>Oro destruido</small><b>'+fmt(o.destroyed)+"</b><small>"+d(o.destroyed,o.previous.destroyed)+'</small></div><div class="kpi"><small>Neto</small><b>'+fmt(o.net)+"</b><small>anterior "+fmt(o.previous.net)+'</small></div><div class="kpi"><small>Volumen transferido</small><b>'+fmt(o.transferVolume)+"</b><small>"+o.events+' eventos</small></div><div class="kpi"><small>Oro en circulación</small><b>'+fmt(o.circulating.value)+'</b><small>snapshot de partidas</small></div><div class="kpi"><small>Índice de precios</small><b>No disponible</b><small>'+esc(o.priceIndex.why)+"</small></div></div><div>Alertas abiertas: "+sev("critical")+" "+o.openAlerts.critical+" · "+sev("warning")+" "+o.openAlerts.warning+" · "+sev("info")+" "+o.openAlerts.info+'</div><div class="dim" style="margin-top:8px">Cobertura: '+esc(o.meta.completeness)+" · estado fuente: "+o.meta.source_status+"</div>";P("#ef-meta").textContent=meta(o.meta)},
async flow(){const f=await get("flow");P("#fl-f").innerHTML="<h3>Fuentes (crean oro)</h3>"+bars(f.faucets,"inflow");P("#fl-s").innerHTML="<h3>Sumideros (destruyen oro)</h3>"+bars(f.sinks,"outflow");
if(!f.series.length){P("#fl-svg").innerHTML='<div class="dim">Sin eventos en el periodo</div>';return}
P("#fl-svg").innerHTML='<div class="dim"><span style="color:#b9d6a5">━ creado</span> <span style="color:#ff8a70">━ destruido</span> · tramo '+Math.round(f.bucket/60000)+" min</div>"+line(f.series,[{k:"created",c:"#b9d6a5"},{k:"destroyed",c:"#ff8a70"}])+'<div class="dim"><span style="color:#f0d27a">━ neto acumulado</span></div>'+line(f.series.map(p=>({...p,cumulative:Math.max(0,p.cumulative)})),[{k:"cumulative",c:"#f0d27a"}]);
P("#fl-svg").onclick=async e=>{const c=e.target.closest("circle");if(!c)return;const p=f.series[+c.dataset.i],r=await fetch(A+"events?"+qs({from:p.t,to:p.t+f.bucket,limit:100})).then(r=>r.json());P("#fl-ev").innerHTML="<h3>Eventos del tramo "+new Date(p.t).toLocaleString()+"</h3>"+evTable(r.events)}},
async al(){const r=await fetch(A+"alerts?status="+P("#al-st").value).then(r=>r.json());
P("#al-l").innerHTML='<table class="bt"><thead><tr><th>Cuándo</th><th>Sev.</th><th>Regla</th><th>Resumen</th><th>Estado</th><th></th></tr></thead><tbody>'+r.alerts.map(a=>"<tr><td>"+new Date(a.ts).toLocaleString()+"</td><td>"+sev(a.severity)+"</td><td>"+a.rule+" v"+a.rule_ver+'</td><td style="white-space:normal" title="'+esc(JSON.stringify(a.evidence))+'">'+esc(a.summary)+'<div class="dim">obs '+fmt(a.observed)+" · base "+fmt(a.baseline)+" · umbral "+fmt(a.threshold)+(a.note?" · nota: "+esc(a.note):"")+'</div></td><td class="st-'+a.status+'">'+a.status+"</td><td>"+["acknowledged","investigating","resolved","dismissed"].map(s=>'<button data-al="'+a.id+'" data-s="'+s+'">'+s.slice(0,4)+"</button>").join("")+"</td></tr>").join("")+"</tbody></table>"+(r.alerts.length?"":'<div class="dim">Sin alertas</div>');
const c=await fetch(A+"config").then(r=>r.json());P("#al-cfg").innerHTML='<div class="dim">Versión activa: '+c.active.version+" · "+esc(c.editable)+'</div><textarea id="cfg-t" style="width:100%;height:160px;background:#2c2418;color:inherit">'+esc(JSON.stringify(c.active.rules,null,1))+'</textarea><div class="row"><input id="cfg-r" placeholder="Motivo del cambio"><button id="cfg-d">Guardar borrador</button></div><div>'+c.versions.map(v=>"<div>v"+v.version+" · "+v.status+" · "+esc(v.reason||"")+' <button data-cv="'+v.version+'" data-ck="'+(v.status==="draft"?"publish":"rollback")+'">'+(v.status==="draft"?"Publicar":"Volver a esta")+"</button></div>").join("")+"</div>"},
async we(){const w=await get("wealth");if(!w.available){P("#p-we").innerHTML="<b>Datos insuficientes</b>: aún no hay partidas de jugadores.";return}
const mx=Math.max(1,...w.histogram.map(h=>h.players));P("#p-we").innerHTML='<div class="kpis"><div class="kpi"><small>Jugadores</small><b>'+w.players+'</b></div><div class="kpi"><small>Oro total</small><b>'+fmt(w.total)+'</b></div><div class="kpi"><small>Mediana</small><b>'+fmt(w.percentiles.p50)+'</b></div><div class="kpi"><small>P90 / P99</small><b>'+fmt(w.percentiles.p90)+" / "+fmt(w.percentiles.p99)+'</b></div><div class="kpi"><small>Gini</small><b>'+(w.gini??"n/d")+'</b></div><div class="kpi"><small>Top 10 %</small><b>'+Math.round(w.top10Share*100)+' %</b></div></div><div class="dim">'+esc(w.confidence)+" · "+esc(w.definition)+"</div><h3>Distribución</h3>"+w.histogram.map(h=>'<div class="bar"><span style="width:160px">'+fmt(h.from)+" – "+(h.to>=1e12?"+":fmt(h.to))+'</span><i style="width:'+Math.round(240*h.players/mx)+'px"></i>'+h.players+"</div>").join("")+'<h3>Por nivel</h3><table class="bt"><tr><th>Nivel</th><th>Jugadores</th><th>Mediana</th><th>Total</th></tr>'+w.byLevel.map(l=>"<tr><td>"+l.level+"</td><td>"+l.players+"</td><td>"+fmt(l.median)+"</td><td>"+fmt(l.total)+"</td></tr>").join("")+"</table>"},
async mk(){const r=await fetch(A+"items").then(r=>r.json());P("#p-mk").innerHTML="<b>No disponible</b> · "+esc(r.why)+'<table class="bt" style="margin-top:8px"><tr><th>Métrica</th><th>Qué falta</th><th>Instrumentación necesaria</th></tr>'+r.missing.map(m=>"<tr><td>"+esc(m.metric)+'</td><td style="white-space:normal">'+esc(m.why)+'</td><td style="white-space:normal">'+esc(m.plan)+"</td></tr>").join("")+"</table>"},
async au(){const r=await fetch(A+"audit?limit=100").then(r=>r.json());P("#p-au").innerHTML='<div class="row"><a href="'+A+"events?format=csv&"+qs()+'"><button>Exportar eventos CSV</button></a></div><table class="bt"><tr><th>Hora</th><th>Actor</th><th>Acción</th><th>Objeto</th><th>Motivo</th><th>Origen</th></tr>'+r.audit.map(a=>"<tr><td>"+new Date(a.ts).toLocaleString()+"</td><td>"+esc(a.actor)+"</td><td>"+esc(a.action)+"</td><td>"+esc(a.object)+"</td><td>"+esc(a.reason||"")+"</td><td>"+esc(a.origin||"")+"</td></tr>").join("")+"</table>"},
async so(){const s=await fetch(A+"sources").then(r=>r.json());P("#p-so").innerHTML='<div class="kpis"><div class="kpi"><small>Sumidero</small><b>'+s.sink.status+"</b><small>"+s.sink.ingested+" ingeridos · "+s.sink.errors+' errores</small></div><div class="kpi"><small>Eventos guardados</small><b>'+fmt(s.store.events)+"</b><small>"+s.store.kind+'</small></div><div class="kpi"><small>Último evento</small><b>'+(s.store.lastEventAgeMs!=null?Math.round(s.store.lastEventAgeMs/1000)+" s":"—")+'</b></div><div class="kpi"><small>Esquema</small><b>v'+s.schemaVersion+"</b><small>config v"+s.config.version+'</small></div></div><div class="dim">'+esc(s.latency)+"<br>"+esc(s.coverage.note)+"<br>Motivos vistos: "+s.coverage.goldReasons.map(esc).join(", ")+"</div>"}};
let es=null,paused=false,lines=[],cur=0;
function live(){if(es)return;const set=(t,c)=>{P("#lv-st").textContent=t;P("#lv-st").className="ecb "+c};set("reconectando","warn");
es=new EventSource(A+"stream?"+(st.bots?"artificial=all&":"")+(cur?"cursor="+cur:""));es.onopen=()=>set("conectado","ok");es.onerror=()=>set(es.readyState===2?"desconectado":"reconectando",es.readyState===2?"bad":"warn");
es.addEventListener("econ",m=>{const e=JSON.parse(m.data);cur=e.cursor;lines.unshift(e);lines.length=Math.min(lines.length,300);if(!paused)drawLive()});
es.addEventListener("beat",m=>{const b=JSON.parse(m.data);if(Math.abs(Date.now()-Date.parse(b.serverTime))>15000)set("retrasado","warn");else set("conectado","ok")})}
function drawLive(){const q=P("#lv-q").value.toLowerCase(),r=lines.filter(e=>!q||(e.actor+" "+e.source).toLowerCase().includes(q));P("#lv-n").textContent=r.length+" eventos";P("#lv-log").innerHTML=r.map(e=>"<div>"+e.occurredAt.slice(11,19)+" · "+esc(e.actor)+" · "+esc(e.source)+' · <span style="color:'+(e.delta<0?"#ff8a70":"#b9d6a5")+'">'+(e.delta>0?"+":"")+fmt(e.delta)+"</span> → "+fmt(e.balanceAfter)+"</div>").join("")}
function go(p){page=p;document.querySelectorAll(".ecs button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));document.querySelectorAll(".ecp").forEach(d=>d.classList.toggle("on",d.id==="p-"+p));if(p==="live")live();else if(loaders[p])loaders[p]().catch(e=>{P("#p-"+p).innerHTML='<span class="sev3">Error: '+esc(e.message)+"</span>"})}
window.ecoOpen=()=>go(page);
P("#ef-p").value=st.p||"24";P("#ef-bots").checked=!!st.bots;P("#ef-c").style.display=st.p==="c"?"":"none";
P("#ef-p").onchange=e=>{st.p=e.target.value;P("#ef-c").style.display=st.p==="c"?"":"none";save();go(page)};P("#ef-bots").onchange=e=>{st.bots=e.target.checked;save();if(es){es.close();es=null;lines=[];cur=0}go(page)};
P("#ef-from").onchange=P("#ef-to").onchange=()=>{st.from=Date.parse(P("#ef-from").value)||"";st.to=Date.parse(P("#ef-to").value)||"";save();go(page)};
document.querySelectorAll(".ecs button").forEach(b=>b.onclick=()=>go(b.dataset.p));
P("#lv-pause").onclick=e=>{paused=!paused;e.target.textContent=paused?"Reanudar":"Pausar";if(!paused)drawLive()};P("#lv-q").oninput=drawLive;
P("#al-st").onchange=()=>go("al");P("#al-ev").onclick=async()=>{await post("alerts",{evaluate:true});go("al")};
P("#econv").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
if(b.dataset.al){let note="";if(b.dataset.s==="dismissed"||b.dataset.s==="resolved"){note=prompt("Motivo / nota"+(b.dataset.s==="dismissed"?" (obligatorio)":""))||"";if(b.dataset.s==="dismissed"&&!note)return}const r=await post("alerts",{id:+b.dataset.al,status:b.dataset.s,note});if(r.error)alert(r.error);go("al")}
if(b.id==="cfg-d"){let d;try{d=JSON.parse(P("#cfg-t").value)}catch{return alert("JSON inválido")}const r=await post("config/drafts",{data:d,reason:P("#cfg-r").value});alert(r.error||("Borrador v"+r.version+(r.highImpact&&r.highImpact.length?" · ALTO IMPACTO: "+r.highImpact.join("; "):"")));go("al")}
if(b.dataset.cv){const r=await post("config/"+b.dataset.ck,{version:+b.dataset.cv,reason:"desde el panel"});if(r.error&&/approve/.test(r.error)&&confirm(r.error))await post("config/"+b.dataset.ck,{version:+b.dataset.cv,approve:true});else if(r.error)alert(r.error);go("al")}});
P("#sim-go").onclick=async()=>{const r=await post("simulations",{hours:st.p==="c"?24:+st.p||24,changes:[{reason:P("#sim-r").value.trim(),factor:+P("#sim-f").value}]});P("#sim-o").innerHTML=r.error?'<span class="sev3">'+esc(r.error)+"</span>":'<div class="kpis"><div class="kpi"><small>Neto actual</small><b>'+fmt(r.baselineNet)+'</b></div><div class="kpi"><small>Neto proyectado</small><b>'+fmt(r.projectedNet)+'</b></div><div class="kpi"><small>Diferencia</small><b>'+fmt(r.delta)+"</b></div></div>"+(r.unknownReasons.length?'<div class="sev2">Motivos sin datos: '+r.unknownReasons.map(esc).join(", ")+"</div>":"")+'<div class="dim"><b>Supuestos:</b> '+r.assumptions.map(esc).join(" ")+"<br><b>Límites:</b> "+r.limitations.map(esc).join(" ")+"</div>"};
})();
</script>
