<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observador dividido</title>
<style>
  :root { --bg:#0e0b05; --panel:#171208; --edge:#4a3f28; --ink:#f0e2b8; --dim:#998; --gold:#ffd76a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:12px/1.4 system-ui,sans-serif; overflow:hidden; }
  #app { display:grid; height:100vh; padding:4px; gap:0; grid-template-columns:var(--c1,68%) 6px minmax(0,1fr); grid-template-rows:var(--r1,58%) 6px minmax(0,1fr); }
  .slot { min-width:0; min-height:0; } #stage { position:absolute; left:0; top:0; width:0; height:0; } #stage > .q { position:absolute; display:none; }
  #s1 { grid-area:1/1; } #s2 { grid-area:1/3; } #hs { grid-area:2/1/3/4; } #bottom { grid-area:3/1/4/4; display:flex; min-height:0; } #vs { grid-area:1/2; }
  #s3 { flex:0 0 var(--b1,50%); } #s4 { flex:1; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; padding:5px 7px; } .chips a { cursor:pointer; padding:1px 7px; border-radius:10px; border:1px solid #6b5a33; background:#2c2417; } .chips a.on { background:#6b5a33; color:var(--gold); }
  .split { background:#2a2312; border-radius:3px; transition:background .1s; } .split:hover, .split.drag { background:#8a7438; }
  #vs, #vs2 { cursor:col-resize; } #hs { cursor:row-resize; } #vs2 { flex:0 0 6px; }
  body.dragging { user-select:none; cursor:inherit; } body.dragging iframe { pointer-events:none; }
  .q { background:var(--panel); border:1px solid var(--edge); border-radius:6px; overflow:hidden; display:flex; flex-direction:column; min-height:0; }
  .q > h3 { margin:0; padding:4px 8px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#b9a572; background:#1b1608; border-bottom:1px solid var(--edge); display:flex; gap:8px; align-items:center; }
  .q > h3 b { color:var(--gold); } .q > h3 .sp { margin-left:auto; }
  .body { overflow:auto; flex:1; min-height:0; padding:6px 8px; }
  #game iframe { flex:1; width:100%; border:0; background:#000; } #game .empty { flex:1; display:grid; place-items:center; color:var(--dim); }
  input, select, button { background:#1b1810; color:var(--ink); border:1px solid #6b5a33; border-radius:6px; padding:3px 7px; font:inherit; }
  button { cursor:pointer; background:#2c2417; }
  .r { display:grid; grid-template-columns:16px 1fr auto; gap:0 5px; padding:3px 7px; cursor:pointer; border-left:3px solid transparent; align-items:center; }
  .r:hover { background:#3a2f18; } .r.me { background:#4a3a14; border-left-color:var(--gold); }
  .hp { height:3px; background:#3a1f1a; border-radius:2px; grid-column:2/4; } .hp i { display:block; height:100%; background:#c0392b; border-radius:2px; }
  .g { padding:4px 7px 2px; color:#b9a572; font-size:11px; text-transform:uppercase; background:#1b1608; position:sticky; top:0; display:flex; justify-content:space-between; }
  .d { color:var(--dim); font-size:11px; grid-column:2/4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .n { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tabs { display:flex; gap:4px; padding:4px 8px; border-bottom:1px solid var(--edge); flex-wrap:wrap; }
  .tabs a { cursor:pointer; padding:2px 8px; border-radius:5px; border:1px solid #6b5a33; background:#2c2417; } .tabs a.on { background:#6b5a33; }
  .bar { display:flex; align-items:center; gap:6px; margin:2px 0; } .bar .lbl { width:96px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .tr { flex:1; height:8px; background:#2c2417; border-radius:4px; } .bar .tr i { display:block; height:100%; border-radius:4px; background:#6a9; } .bar .v { width:34px; text-align:right; }
  .sec { margin:8px 0 3px; color:#b9a572; font-size:11px; text-transform:uppercase; border-bottom:1px solid #3a2f18; }
  .spark { display:grid; grid-template-columns:70px 1fr 64px; align-items:center; gap:6px; } .spark svg { width:100%; height:26px; background:#120e06; border-radius:3px; }
  @media (max-width: 800px) { #app { grid-template-columns:1fr; grid-template-rows:60vh 50vh 50vh 50vh; } #s1, #s2 { grid-area:auto; } #hs, #vs, #vs2 { display:none; } #bottom { grid-area:auto; display:contents; } #s3, #s4 { flex:none; height:50vh; } html, body { overflow:auto; } }
</style>
</head>
<body>
<div id="app">
  <div class="slot" id="s1"></div>
  <div class="split" id="vs" title="↔"></div>
  <div class="slot" id="s2"></div>
  <div class="split" id="hs" title="↕"></div>
  <div id="bottom"><div class="slot" id="s3"></div><div class="split" id="vs2" title="↔"></div><div class="slot" id="s4"></div></div>
  <div id="stage"><section class="q" id="game"></section><section class="q" id="roster"></section><section class="q" id="info"></section><section class="q" id="stats"></section><section class="q" id="glob"></section><section class="q" id="summ"></section><section class="q" id="chars"></section><section class="q" id="pvp"></section></div>
</div>
<script type="module" src="src/client/dashboard.js"></script>
</body>
</html>
