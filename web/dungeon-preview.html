<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cripta — vista de prueba</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#111;color:#e8dcc3;font:14px Tahoma,sans-serif}
  header{min-height:54px;padding:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  input{width:90px}button,select,input{background:#29262b;color:#e8dcc3;border:1px solid #756959;padding:5px}
  canvas{display:block;width:100%;height:calc(100vh - 80px);image-rendering:pixelated}
  #status{padding:5px 10px;margin:0;font-size:12px}a{color:#bde8ff}
</style>
<header>
  <b>Cripta · vista previa sin combate</b>
  <label>Seed <input id="seed" type="number" min="0" max="4294967295" value="54"></label>
  <button id="generate">Generar</button>
  <label>Cámara <select id="room"></select></label>
  <button id="mode">Ver clásico</button>
  <label><input id="walk" type="checkbox"> Caminata del esqueleto</label>
  <label>Dirección <select id="direction"><option value="1">N</option><option value="2">NE</option><option value="3">E</option><option value="4">SE</option><option value="5">S</option><option value="6">SO</option><option value="7">O</option><option value="8">NO</option></select></label>
  <a href="./">Abrir juego</a>
</header>
<p id="status" role="status">Cargando piedra, pilares, antorchas y esqueletos…</p>
<canvas id="game" aria-label="Vista previa de la mazmorra"></canvas>
<script type="module">
  import { generateDungeon, DUNGEON_ASSETS } from "./src/shared/dungeon.js";
  import { World } from "./src/shared/world.js";
  import { GameData } from "./src/shared/data.js";
  import { Sprites, loadSpriteImage, validateDungeonAssets } from "./src/client/assets.js";
  import { Renderer } from "./src/client/renderer.js";
  const $ = id => document.getElementById(id), status = $("status");
  async function start() {
    const json = async file => { const r = await fetch("data/" + file, { cache: "no-cache" }); if (!r.ok) throw Error(file); return r.json(); };
    const [manifest, npcDb, items, magic, hd] = await Promise.all([json("sprites.json"),json("npc.json"),json("items.json"),json("magic.json"),json("sprites_hd.json")]);
    validateDungeonAssets(manifest, npcDb);
    const images = {};
    await Promise.all(DUNGEON_ASSETS.map(async k => { images[k] = await loadSpriteImage(manifest[k].png); }));
    const sprites = new Sprites(manifest, images, hd), data = new GameData({ items, magic, npcs: npcDb });
    await sprites.preloadHd(Array.from({ length:8 }, (_,d) => "ske" + (8+d)));
    let world, layout, renderer, me;
    function generate() {
      const seed = Number($("seed").value) >>> 0; $("seed").value = seed;
      layout = generateDungeon(seed);
      world = new World({ grid:layout.grid, npcDb, data, spawns:layout.spawns, start:layout.start });
      world.map = { kind:"dungeon", portals:layout.portals, totalEnemies:world.ents.size, remainingEnemies:world.ents.size };
      me = { x:layout.start[0], y:layout.start[1], fx:layout.start[0], fy:layout.start[1], act:0, actStart:0, actDur:0 };
      if (!renderer) renderer = new Renderer($("game"), { sprites, meta:{map:"Cripta"} }, layout.grid);
      else renderer.setMap(layout.grid, "Cripta");
      $("room").replaceChildren(...layout.rooms.map((r,i) => new Option(r.name,String(i))));
      status.textContent = `Seed ${seed} · ${layout.grid.w} × ${layout.grid.h} · 9 cámaras y 4 ramales · galerías de 3–7 casillas · ${world.ents.size} esqueletos · sprites cargados`;
    }
    $("generate").onclick = generate;
    $("room").onchange = () => {
      const i = Number($("room").value), r = layout.rooms[i], point = i ? [r.cx,r.cy] : layout.start;
      me.x = me.fx = point[0]; me.y = me.fy = point[1]; renderer.cam = null;
    };
    $("mode").onclick = () => { renderer.setMode(renderer.mode === "classic" ? "remastered" : "classic"); $("mode").textContent = renderer.mode === "classic" ? "Ver remastered" : "Ver clásico"; };
    generate(); addEventListener("resize", () => renderer.resize());
    function frame(time) {
      world.time = time;
      // Animación de inspección, sin mover entidades ni alterar la simulación del juego.
      for (const e of world.ents.values()) {
        e.dir = Number($("direction").value);
        e.act = $("walk").checked ? 1 : 0;
        e.actDur = $("walk").checked ? 560 : 0;
        e.actStart = time - time % 560;
      }
      renderer.render({ world, me, dt:16, fx:{flash:new Map(),draw(){}}, showMinimap:true, mapStyle:"corner" });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  start().catch(err => { status.textContent = "Error: " + err.message; console.error(err); });
</script>
</html>
