<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>hbweb · Menú</title>
<style>
body{margin:0;background:#15110a;color:#e8d9b0;font:14px/1.45 system-ui,sans-serif}main{max-width:820px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;margin-bottom:14px}button{background:#2a2113;color:#e8d9b0;border:1px solid #6b5a30;padding:6px 14px;cursor:pointer}button.on{background:#6b5a30}
h2{margin:18px 0 4px;font-size:15px;color:#f0c860}.row{border-bottom:1px solid #3a2f1a;padding:6px 0}.dim{color:#9a8a60;font-size:12px}ul{margin:2px 0 8px;padding-left:20px}
.done{opacity:.55}.tag{display:inline-block;padding:0 6px;border:1px solid #6b5a30;margin-right:6px;font-size:12px}
</style>
<main><nav id=nav></nav><div id=v>Cargando…</div></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const token=new URLSearchParams(location.search).get("token")||"";
const L=o=>typeof o==="string"?o:o&&(o.es||o.en)||"";
const tabs={
  async log(){const d=await (await fetch("data/news.json",{cache:"no-cache"})).json();
    return "<h2>"+esc(L(d.build))+"</h2>"+d.news.map(n=>"<h2>"+esc(L(n.title))+' <span class=dim>'+esc(n.date)+"</span></h2><ul>"+n.items.map(i=>"<li>"+esc(L(i))+"</li>").join("")+"</ul>").join("")},
  async back(){const d=await (await fetch("data/backlog.json",{cache:"no-cache"})).json();
    return d.tickets.slice().sort((a,b)=>a.prio-b.prio).map(t=>`<div class="row ${t.status==="done"?"done":""}"><span class=tag>#${t.id} · ${esc(t.status)}</span><b>${esc(t.title)}</b><div>${esc(t.text)}</div><div class=dim>Reinterpretación: ${esc(t.interp)}</div></div>`).join("")},
  async bugs(){const r=await fetch("/api/admin/bugs?token="+encodeURIComponent(token));if(!r.ok)return"<p>Sin acceso: solo desde el servidor (localhost) con <code>?token=…</code>.</p>";
    const {list}=await r.json();if(!list.length)return"<p>Sin reportes.</p>";
    return list.map(b=>`<div class="row ${b.status!=="open"?"done":""}"><span class=tag>#${b.id} ${b.kind}${b.n>1?" ×"+b.n:""} · ${b.status}</span><span class=dim>${esc(b.user)} v${esc(b.ver)} ${esc(b.map)} (${b.x},${b.y}) ${new Date(b.at).toLocaleString()}</span><div>${esc(b.text)}</div><button data-i=${b.id} data-s=fixed>Arreglado</button> <button data-i=${b.id} data-s=wontfix>Descartar</button> <button data-i=${b.id} data-s=open>Reabrir</button></div>`).join("")}
};
const names={log:"Changelog",back:"Backlog",bugs:"Errores"};let cur="log";
async function show(k){cur=k;$("#nav").innerHTML=Object.keys(names).map(x=>`<button class="${x===k?"on":""}" data-t=${x}>${names[x]}</button>`).join("");
  try{$("#v").innerHTML=await tabs[k]()}catch(e){$("#v").textContent="Error: "+e}}
document.onclick=async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.t)return show(b.dataset.t);
  if(b.dataset.i){await fetch("/api/admin/bugs?token="+encodeURIComponent(token),{method:"POST",body:JSON.stringify({id:+b.dataset.i,status:b.dataset.s})});show(cur)}};
show("log");
</script></html>
